name: Deploy sito su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/generami-sito-web-parrucchiere-7qedbd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito (tutta la root del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4
